<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunkWise — Student Attendance & SGPA Hub</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 0.4rem;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 0.3rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #090d16;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.8rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      background-color: #0d1322;
      border: 1px solid #2d3b55;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: #090d16;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 1.2rem;
      border-radius: 10px;
      background: #0d1322;
      border-left: 4px solid var(--primary);
      display: none;
    }

    .result-percentage {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
    }

    .result-status {
      font-size: 1rem;
      line-height: 1.5;
    }

    .status-safe {
      border-left-color: var(--green);
    }
    .status-safe .result-percentage {
      color: var(--green);
    }

    .status-danger {
      border-left-color: var(--red);
    }
    .status-danger .result-percentage {
      color: var(--red);
    }

    /* SGPA Table styles */
    .subject-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1.2fr auto;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .remove-btn {
      background: #ef444422;
      border: 1px solid #ef444455;
      color: #ef4444;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .add-btn {
      background: transparent;
      border: 1px dashed var(--primary);
      color: var(--primary);
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .add-btn:hover {
      background: #38bdf815;
    }

    footer {
      margin-top: auto;
      padding-top: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>BunkWise</h1>
    <p>Daily Student Attendance & SGPA Estimator</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('attendance')">Attendance / Bunk</button>
    <button class="tab-btn" onclick="switchTab('sgpa')">SGPA Calculator</button>
  </div>

  <div class="container">
    <!-- Attendance Calculator -->
    <div id="attendance-tab" class="card tab-content active">
      <div class="form-group">
        <label for="attended">Classes Attended</label>
        <input type="number" id="attended" placeholder="e.g. 28" min="0" />
      </div>

      <div class="form-group">
        <label for="total">Total Classes Conducted</label>
        <input type="number" id="total" placeholder="e.g. 35" min="1" />
      </div>

      <div class="form-group">
        <label for="target">Target Attendance Percentage (%)</label>
        <input type="number" id="target" value="75" min="1" max="100" />
      </div>

      <button class="btn" onclick="calculateAttendance()">Calculate Status</button>

      <div id="attendance-result" class="result-box">
        <div class="result-percentage" id="current-percent">0%</div>
        <div class="result-status" id="status-message"></div>
      </div>
    </div>

    <!-- SGPA Calculator -->
    <div id="sgpa-tab" class="card tab-content">
      <div id="subjects-container">
        <!-- Default subject rows -->
      </div>
      <button class="add-btn" onclick="addSubjectRow()">+ Add Subject</button>
      <button class="btn" style="margin-top: 1rem;" onclick="calculateSGPA()">Calculate SGPA</button>

      <div id="sgpa-result" class="result-box">
        <div class="result-percentage" id="sgpa-value">0.00</div>
        <div class="result-status" id="sgpa-message"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>Saved automatically to your device via LocalStorage</p>
  </footer>

  <script>
    // --- Tab Switching Logic ---
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'attendance') {
        document.querySelector('.tabs button:first-child').classList.add('active');
        document.getElementById('attendance-tab').classList.add('active');
      } else {
        document.querySelector('.tabs button:last-child').classList.add('active');
        document.getElementById('sgpa-tab').classList.add('active');
      }
    }

    // --- Attendance & Bunk Formula Logic ---
    function calculateAttendance() {
      const attended = parseInt(document.getElementById('attended').value);
      const total = parseInt(document.getElementById('total').value);
      const target = parseFloat(document.getElementById('target').value) || 75;

      const resultBox = document.getElementById('attendance-result');
      const percentDisplay = document.getElementById('current-percent');
      const statusMsg = document.getElementById('status-message');

      if (isNaN(attended) || isNaN(total) || total <= 0 || attended < 0 || attended > total) {
        alert('Please enter valid attendance numbers (Attended cannot exceed Total).');
        return;
      }

      // Save to localStorage
      localStorage.setItem('bw_attended', attended);
      localStorage.setItem('bw_total', total);
      localStorage.setItem('bw_target', target);

      const currentPercent = ((attended / total) * 100).toFixed(1);
      percentDisplay.textContent = `${currentPercent}%`;
      resultBox.style.display = 'block';

      resultBox.classList.remove('status-safe', 'status-danger');

      if (currentPercent >= target) {
        // Safe: How many can be bunked?
        // (attended / (total + x)) >= (target / 100)
        // x <= (attended * 100 / target) - total
        const maxBunk = Math.floor((attended * 100 / target) - total);
        resultBox.classList.add('status-safe');
        if (maxBunk > 0) {
          statusMsg.innerHTML = `You are safe! You can bunk the next <strong>${maxBunk}</strong> classes while staying at or above ${target}%.`;
        } else {
          statusMsg.innerHTML = `You are on the boundary! You cannot afford to miss the next class without dropping below ${target}%.`;
        }
      } else {
        // Danger: How many continuous classes needed?
        // (attended + y) / (total + y) >= (target / 100)
        // y >= (target * total - 100 * attended) / (100 - target)
        const required = Math.ceil((target * total - 100 * attended) / (100 - target));
        resultBox.classList.add('status-danger');
        statusMsg.innerHTML = `Shortage alert! You must attend the next <strong>${required}</strong> classes consecutively to reach ${target}%.`;
      }
    }

    // --- SGPA Logic ---
    const gradePoints = {
      'O (10)': 10,
      'A+ (9)': 9,
      'A (8)': 8,
      'B+ (7)': 7,
      'B (6)': 6,
      'C (5)': 5,
      'F (0)': 0
    };

    function addSubjectRow(name = '', credits = 3, grade = 'A+ (9)') {
      const container = document.getElementById('subjects-container');
      const row = document.createElement('div');
      row.className = 'subject-row';

      row.innerHTML = `
        <input type="text" placeholder="Subject" value="${name}" class="sub-name" />
        <input type="number" placeholder="Credits" value="${credits}" min="1" max="10" class="sub-credits" />
        <select class="sub-grade">
          ${Object.keys(gradePoints).map(g => `<option value="${gradePoints[g]}" ${g === grade ? 'selected' : ''}>${g}</option>`).join('')}
        </select>
        <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    function calculateSGPA() {
      const rows = document.querySelectorAll('.subject-row');
      let totalCredits = 0;
      let weightedPoints = 0;

      rows.forEach(row => {
        const credits = parseFloat(row.querySelector('.sub-credits').value) || 0;
        const gradePoint = parseFloat(row.querySelector('.sub-grade').value) || 0;

        totalCredits += credits;
        weightedPoints += credits * gradePoint;
      });

      const resultBox = document.getElementById('sgpa-result');
      const sgpaDisplay = document.getElementById('sgpa-value');
      const msgDisplay = document.getElementById('sgpa-message');

      if (totalCredits === 0) {
        alert('Please add at least one subject with valid credits.');
        return;
      }

      const sgpa = (weightedPoints / totalCredits).toFixed(2);
      sgpaDisplay.textContent = `${sgpa} SGPA`;
      msgDisplay.textContent = `Calculated across ${rows.length} subjects (${totalCredits} total credits).`;
      resultBox.style.display = 'block';
      resultBox.className = 'result-box ' + (sgpa >= 7.5 ? 'status-safe' : 'status-danger');
    }

    // --- On Load: Restore previous inputs ---
    window.onload = () => {
      const savedAttended = localStorage.getItem('bw_attended');
      const savedTotal = localStorage.getItem('bw_total');
      const savedTarget = localStorage.getItem('bw_target');

      if (savedAttended && savedTotal) {
        document.getElementById('attended').value = savedAttended;
        document.getElementById('total').value = savedTotal;
        document.getElementById('target').value = savedTarget || 75;
        calculateAttendance();
      }

      // Initialize 4 default subject rows
      addSubjectRow('Mathematics', 4, 'A+ (9)');
      addSubjectRow('Programming in C', 4, 'O (10)');
      addSubjectRow('Engineering Physics', 3, 'A (8)');
      addSubjectRow('English / Comm', 1, 'O (10)');
    };
  </script>
</body>
</html>
